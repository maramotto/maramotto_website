name = "maramotto-decap-oauth"
main = "worker.js"
compatibility_date = "2026-09-22"

[vars]
ALLOWED_ORIGIN = "https://maramotto.com"

# GITHUB_CLIENT_ID y GITHUB_CLIENT_SECRET se configuran como secrets,
