# www is a separate host that served the site directly (HTTP 200, no
# redirect) instead of canonicalizing to the apex domain. That splits
# inbound links/backlinks across two hosts and breaks the mara_lang
# localStorage preference, which is scoped per-origin.
server {
    listen 80;
    server_name www.maramotto.com;
    return 301 https://maramotto.com$request_uri;
}

server {
    listen 80;
    server_name localhost maramotto.com;
    root /usr/share/nginx/html;
    index index.html;

    # Old flat URLs, replaced 2026-08-31 by /cuerposonoro/ and
    # /universo-punzadas/ directory URLs. Keep these 301s indefinitely —
    # they're what's link-shared/bookmarked from before the migration.
    location = /cuerposonoro.html { return 301 /cuerposonoro/; }
    location = /en/cuerposonoro.html { return 301 /en/cuerposonoro/; }
    location = /universo-punzadas.html { return 301 /universo-punzadas/; }
    location = /en/universo-punzadas.html { return 301 /en/universo-punzadas/; }

    # Clean URLs - serve .html files without extension
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # CSS/JS have no cache-busting hashes in filenames, so "immutable" would
    # keep stale assets served for up to 30 days after a deploy. Use a short
    # cache with revalidation instead.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Images and fonts rarely change; safe to cache long-term as immutable.
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # TLS is terminated upstream of this container; the header still reaches
    # the client over HTTPS since the front proxy forwards response headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Custom 404
    error_page 404 /index.html;
}
